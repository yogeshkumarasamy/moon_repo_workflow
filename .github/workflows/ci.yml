name: Moon CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Moon CI (Affected Tasks & Remote Cache)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required for moon to determine changed files across commits and base branches
          fetch-depth: 0

      - name: Restore / Cache Bazel Remote Storage
        uses: actions/cache@v4
        with:
          path: /tmp/bazel-cache
          key: bazel-remote-storage-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            bazel-remote-storage-${{ runner.os }}-${{ github.ref_name }}-
            bazel-remote-storage-${{ runner.os }}-
            bazel-remote-storage-

      - name: Start Bazel Remote Cache Container
        run: |
          mkdir -p /tmp/bazel-cache
          chmod -R 777 /tmp/bazel-cache
          docker run -d --name bazel-remote \
            -p 9092:9092 -p 8080:8080 \
            -v /tmp/bazel-cache:/data \
            buchgr/bazel-remote-cache:latest \
            --max_size=5 --dir=/data --grpc_address=0.0.0.0:9092 --http_address=0.0.0.0:8080 --storage_mode=uncompressed
          sleep 3
          echo "=== Remote Cache Initial Stats ==="
          curl -s http://localhost:8080/status || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Moon Tasks
        env:
          MOON_REMOTE_HOST: ${{ secrets.MOON_REMOTE_HOST || 'grpc://127.0.0.1:9092' }}
        run: |
          if [[ "$MOON_REMOTE_HOST" =~ ^https?:// ]]; then
            export MOON_REMOTE_API="http"
            echo "Using HTTP Remote Cache API for $MOON_REMOTE_HOST"
          else
            export MOON_REMOTE_API="grpc"
            echo "Using gRPC Remote Cache API for $MOON_REMOTE_HOST"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running Moon CI for PR against base: ${{ github.base_ref }}"
            pnpm exec moon ci --base "${{ github.base_ref }}" --summary detailed
          else
            echo "Running full verification on main to prime remote cache"
            pnpm exec moon run :build :test :lint --summary detailed
          fi

      - name: Print Remote Cache Final Stats
        if: always()
        run: |
          echo "=== Remote Cache Final Stats ==="
          curl -s http://localhost:8080/status || true

      - name: Publish Moon run report
        uses: moonrepo/run-report-action@v1
        if: always()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
